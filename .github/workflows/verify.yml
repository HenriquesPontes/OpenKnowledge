name: Verify Open Knowledge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Catch the same TypeScript contract errors Vercel failed on (missing i18n keys).
      - name: Typecheck
        run: npm run typecheck
